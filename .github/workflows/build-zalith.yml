          4Pz298EALPYqYJKHjHwyveiJNqAGYi8LKwnP+RdzGZ//xRQAAA==
          B64

      - name: "Verificação 4/4 - correção automática"
        run: |
          set -uo pipefail
          : "${PROJECT_DIR:?PROJECT_DIR não definido: o passo 3/4 não gravou as variáveis}"
          : "${APP_DIR:?APP_DIR não definido: o passo 3/4 não gravou as variáveis}"
          : "${GRADLE_VERSION:=0}" "${HAS_RUST:=false}" "${REPORT_DIR:=/tmp/zreport}"
          echo "PROJECT_DIR=$PROJECT_DIR | APP_DIR=$APP_DIR | GRADLE=$GRADLE_VERSION | RUST=$HAS_RUST"
          cd "$PROJECT_DIR" || { echo "::error::não consegui entrar em $PROJECT_DIR"; exit 1; }
          fixed()   { echo "$1" >> "$REPORT_DIR/fixed.txt"; echo "CORRIGIDO: $1"; }
          problem() { echo "$1" >> "$REPORT_DIR/problems.txt"; echo "::warning::PROBLEMA: $1"; }

          if [ ! -x gradlew ]; then
            problem "gradlew sem permissão de execução"; chmod +x gradlew && fixed "chmod +x gradlew"
          fi

          gmaj=${GRADLE_VERSION%%.*}
          case "$gmaj" in ''|*[!0-9]*) gmaj=0 ;; esac
          for s in settings.gradle.kts settings.gradle; do
            [ -f "$s" ] || continue
            v=$(grep -oE 'foojay-resolver-convention["'"'"')[:space:]]*version[[:space:]]*?["'"'"'][0-9.]+' "$s" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
            if [ -n "$v" ] && [ "$gmaj" -ge 9 ]; then
              minor=$(echo "$v" | cut -d. -f1-2)
              if [ "$(printf '%s\n0.10\n' "$minor" | sort -V | head -1)" != "0.10" ] && [ "$v" != "0.10.0" ]; then
                problem "$s usa foojay-resolver-convention $v, incompatível com Gradle $GRADLE_VERSION"
                sed -i -E "s/(foojay-resolver-convention[\"')[:space:]]*version[[:space:]]*\(?[\"'])$v/\11.0.0/" "$s" \
                  && fixed "foojay-resolver-convention $v -> 1.0.0 em $s (funcionalidade preservada)"
              fi
            fi
          done

          for k in "$APP_DIR"/zalith_launcher_debug.jks "$APP_DIR"/zalith_launcher.jks; do
            [ -f "$k" ] && echo "keystore OK: $k" || problem "keystore ausente: $k"
          done

          if [ -n "${NDK_MK_PATH:-}" ]; then
            [ -f "$APP_DIR/$NDK_MK_PATH" ] && echo "Android.mk OK" || problem "Android.mk ausente: $APP_DIR/$NDK_MK_PATH"
          fi
          [ "$HAS_RUST" = "true" ] && { [ -f PetLib/rust/Cargo.lock ] && echo "Cargo.lock OK" || problem "Cargo.lock ausente"; }
          cat > /tmp/gb.sh <<'S'
          cd "$PROJECT_DIR"
          e() { grep -A14 -m1 "What went wrong" "$REPORT_DIR/build-$2.log" | head -16; }
          f() { e "$@"; echo "::error title=Falha em $1::$(e "$@" | sed ':a;N;$!ba;s/\n/%0A/g')"; }
          for i in 1 2 3; do
            if ./gradlew "${APP_PATH}:$1" -I /tmp/oi.gradle --no-daemon -q --console=plain > "$REPORT_DIR/build-$2.log" 2>&1; then echo "Build $1 OK"; exit 0; fi
            c=0
            for loc in $(grep -A1 "Unresolved reference 'weight'" "$REPORT_DIR/build-$2.log" | grep -oE 'Location: /[^ ]+ line [0-9]+' | tr ' ' '|'); do
              IFS='|' read -r _ p _ l <<< "$loc"
              [ -f "$p" ] && sed -i -E "${l}s/\.weight\([^()]*(\([^()]*[^()]*)*\)//g" "$p" && c=1 \
                && echo "Removido .weight(...) fora de Row/Column em ${p##*/}:$l" | tee -a "$REPORT_DIR/fixed.txt"
            done
            [ "$c" = 1 ] || { f "$@"; exit 1; }
          done
          f "$@"; exit 1
          S
          cat > /tmp/oi.gradle <<'O'
          allprojects { tasks.matching { it.class.name.contains('KotlinCompile') }.configureEach { t ->
            try {
              t.compilerOptions.optIn.addAll([
                'androidx.compose.material3.ExperimentalMaterial3Api',
                'androidx.compose.material3.ExperimentalMaterial3ExpressiveApi',
                'androidx.compose.foundation.ExperimentalFoundationApi',
                'androidx.compose.foundation.layout.ExperimentalLayoutApi',
                'androidx.compose.animation.ExperimentalAnimationApi',
                'androidx.compose.ui.ExperimentalComposeUiApi',
                'androidx.compose.animation.ExperimentalSharedTransitionApi'
              ])
            } catch (e) {}
          } }
          O

      - name: "Segunda verificação (após as correções)"
        run: |
          cd "$PROJECT_DIR"
          for f in gradlew gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties "$APP_DIR/src/main/AndroidManifest.xml"; do
            [ -f "$f" ] || { echo "::error::arquivo ausente: $f"; exit 1; }
          done
          [ -x gradlew ] || { echo "::error::gradlew sem permissão"; exit 1; }
          echo "Segunda verificação OK"

      - name: Adicionar Java 21 e 25 ao projeto
        run: |
          set -eu
          A=$(find "$SRC_ROOT" -type d -path "*/src/main/assets/runtimes" | sort | head -1)
          [ -n "$A" ] || { echo "::error::assets/runtimes nao encontrada"; exit 1; }
          mkdir -p "$A/jre-21" "$A/jre-25"
          W="$GITHUB_WORKSPACE"
          [ -f "$W/jre-21-universal.tar.xz" ] || { echo "::error::jre-21-universal.tar.xz ausente na raiz"; exit 1; }
          cp "$W/jre-21-universal.tar.xz" "$A/jre-21/universal.tar.xz"
          if [ -f "$W/jre-25-universal.tar.xz" ]; then
            cp "$W/jre-25-universal.tar.xz" "$A/jre-25/universal.tar.xz"
          else
            ls "$W"/jre-25-universal.tar.xz.part* >/dev/null || { echo "::error::jre-25 (ou .part00/.part01) ausente na raiz"; exit 1; }
            cat "$W"/jre-25-universal.tar.xz.part* > "$A/jre-25/universal.tar.xz"
          fi
          xz -t "$A/jre-21/universal.tar.xz" "$A/jre-25/universal.tar.xz"
          ls -l "$A/jre-21" "$A/jre-25"

      - name: Conferir runtimes Java embutidos
        run: |
          for v in 8 17 21 25; do
            s=$(find "$SRC_ROOT" -path "*runtimes/jre-$v/universal.tar.xz" -printf '%s' 2>/dev/null | head -c 12)
            echo "Java $v: ${s:-0} bytes"
            [ "${s:-0}" -gt 1000000 ] || echo "Java $v ausente ou vazio nos ZIPs (${s:-0} bytes): o app não instala esse runtime" >> "$REPORT_DIR/problems.txt"
          done

      - name: Instalar JDKs necessários
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JDK_LIST }}

      - name: Instalar Android SDK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          B="$ANDROID_HOME/cmdline-tools/latest/bin"
          if [ ! -x "$B/sdkmanager" ]; then
            curl -fsSL -o /tmp/ct.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/ct.zip -d /tmp/ct && mkdir -p "$ANDROID_HOME/cmdline-tools" && mv /tmp/ct/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          fi
          echo "$B" >> "$GITHUB_PATH"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          yes | "$B/sdkmanager" --licenses >/dev/null 2>&1 || true

      - name: Instalar NDK
        if: env.NDK_VERSION != ''
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "ndk;${NDK_VERSION}" 2>&1 | tee "$REPORT_DIR/ndk.log"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Instalar Rust (se o projeto usar)
        if: env.HAS_RUST == 'true'
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
          cargo install cargo-ndk --locked 2>&1 | tail -n 5

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decidir tipos de build
        run: |
          s=false; [ -n "${STORE_PASSWORD:-}" ] && [ -n "${KEY_PASSWORD:-}" ] && s=true
          d=true; r=false
          case "$BUILD_TYPE" in
            debug) ;;
            release) d=false; r=true ;;
            both) r=true ;;
            *) r=$s ;;
          esac
          if [ "$r" = true ] && [ "$s" != true ]; then
            echo "Release ignorado: secrets ausentes" >> "$REPORT_DIR/problems.txt"; r=false
          fi
          echo "BUILD_DEBUG=$d" >> "$GITHUB_ENV"; echo "BUILD_RELEASE=$r" >> "$GITHUB_ENV"

      - name: Compilar Debug
        if: env.BUILD_DEBUG == 'true'
        run: |
          cd "$PROJECT_DIR"
          bash /tmp/gb.sh assembleDebug debug

      - name: Compilar Release
        if: env.BUILD_RELEASE == 'true'
        run: |
          cd "$PROJECT_DIR"
          bash /tmp/gb.sh assembleRelease release

      - name: Coletar APKs
        if: always()
        run: |
          set +e +o pipefail
          mkdir -p /tmp/apks
          find "${PROJECT_DIR:-.}" -
