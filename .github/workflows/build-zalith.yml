          TfPVxejr77/Mz7/7IRq342nbMm8vvjm/ys/fj4avB6PzN/0OOXTGXz8veqhgCQAA
          B64

      - name: "Completar arquivos da raiz do Gradle (se faltarem)"
        run: |
          set -eu
          if [ -f "$SRC_ROOT/settings.gradle.kts" ] || [ -f "$SRC_ROOT/settings.gradle" ]; then
            echo "settings.gradle já existe; nada a completar."
            exit 0
          fi
          echo "Raiz do Gradle ausente nos ZIPs; baixando do repositório original (ref: $UPSTREAM_REF)."
          git clone --depth 1 --branch "$UPSTREAM_REF" https://github.com/ZalithLauncher/ZalithLauncher2.git /tmp/upstream
          for f in settings.gradle.kts build.gradle.kts gradle.properties gradlew gradlew.bat; do
            if [ -f "/tmp/upstream/$f" ] && [ ! -f "$SRC_ROOT/$f" ]; then
              cp "/tmp/upstream/$f" "$SRC_ROOT/$f"
              echo "Completado da raiz original: $f" | tee -a "$REPORT_DIR/fixed.txt"
            fi
          done
          if [ -d /tmp/upstream/gradle ] && [ ! -d "$SRC_ROOT/gradle" ]; then
            cp -r /tmp/upstream/gradle "$SRC_ROOT/gradle"
            echo "Completado da raiz original: pasta gradle/" | tee -a "$REPORT_DIR/fixed.txt"
          fi
          [ -f "$SRC_ROOT/gradlew" ] && chmod +x "$SRC_ROOT/gradlew"
          ls -la "$SRC_ROOT" | head -40

      - name: "Verificação 3/4 - identificar a estrutura real do projeto Android"
        run: |
          echo "=== Diagnóstico: conteúdo extraído em $SRC_ROOT ==="
          echo "Total de arquivos: $(find "$SRC_ROOT" -type f | wc -l)"
          echo "--- Pastas de topo ---"
          ls -la "$SRC_ROOT" | head -40
          echo "--- Arquivos de build encontrados ---"
          find "$SRC_ROOT" \( -name 'settings.gradle*' -o -name 'build.gradle*' -o -name 'gradlew' \) -not -path '*/node_modules/*' | head -30
          echo "--- ZIPs/arquivos grandes dentro do extraído (possíveis ZIPs aninhados) ---"
          find "$SRC_ROOT" -type f \( -name '*.zip' -o -name '*.tar*' -o -name '*.7z' \) | head -20
          echo "--- Conteúdo de cada ZIP (primeiras 6 entradas) ---"
          while read -r z; do echo "# $(basename "$z")"; unzip -Z1 "$z" | head -6; done < "$REPORT_DIR/zips.txt"
          echo "--- ARQUIVOS_OMITIDOS.txt ---"
          cat "$SRC_ROOT/ARQUIVOS_OMITIDOS.txt" 2>/dev/null || echo "(não encontrado)"
          echo "--- Arquivos da raiz do projeto ---"
          ls -la "$SRC_ROOT/gradle" 2>/dev/null || echo "(sem pasta gradle/ na raiz)"
          echo "=== Fim do diagnóstico ==="
          base64 -d <<'B64' | gunzip | python3 -
          H4sIAAAAAAACA51Y607jShL+76dotVbCZsDA/NlzzMlBnIHDcCCAAjNaKcmJOnE7GHyT2wkZZfIw
